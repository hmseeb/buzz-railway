name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: buzz-railway
            dockerfile: Dockerfile
            test: ./test/boot_test.sh
          - image: buzz-railway-minio
            dockerfile: Dockerfile.minio
            test: ./test/minio_test.sh
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Gate on the contract test before anything is published. Built for the
      # runner's own arch so the test can actually execute the image.
      - name: Build for test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.image }}:test

      - name: Contract test
        run: ${{ matrix.test }} ${{ matrix.image }}:test

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Railway runs amd64; arm64 is included so the images stay usable locally
      # on Apple silicon.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}

# ponytail: no automatic upstream-digest bump yet. Upstream ships ~daily with no
# semver tags on GHCR, so the FROM digest is bumped by hand. Automate with a
# scheduled job that opens a PR when the cadence gets annoying.
