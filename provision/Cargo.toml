[package]
name = "buzz-provision"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "buzz-provision"
path = "src/main.rs"

[dependencies]
nostr = { version = "0.44", features = ["nip98", "std"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
